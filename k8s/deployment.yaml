apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppers-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shoppers
  template:
    metadata:
      labels:
        app: shoppers
    spec:
      containers:
        - name: api
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: shoppers-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shoppers-dbb
                  key: DATABASE_URL
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
