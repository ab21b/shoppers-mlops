apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppers-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shoppers
  template:
    metadata:
      labels:
        app: shoppers
    spec:
      containers:
        - name: api
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: shoppers-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shoppers-db
                  key: DATABASE_URL
          lifecycle:
            preStop:
              sleep: {seconds: 5}    
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 90      
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            
