apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppers-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shoppers
  template:
    metadata:
      labels:
        app: shoppers
    spec:
      containers:
        - name: api
          image: shoppers-service:1.0
          imagePullPolicy: IfNotPresent   # образ загружен в kind через `kind load`, из registry его не тянем
          ports:
            - containerPort: 8000
          # DATABASE_URL не задан: сервис работает и не логирует (Postgres живёт в compose)
          startupProbe:                   # даём время на загрузку модели, пока она не прошла, остальные пробы молчат
            httpGet: {path: /health, port: 8000}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:                  # процесс жив? иначе перезапуск
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          readinessProbe:                 # модель загружена? иначе под не получает трафик
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
